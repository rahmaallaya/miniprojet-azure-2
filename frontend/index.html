<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Gestion d'Instruments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3"><span class="navbar-brand">♫ Gestion d'Instruments</span></nav>
<div class="container my-4">
<h3>Liste des instruments</h3>
<form id="f" class="row g-2 my-3">
<div class="col-md-2"><input id="nom" class="form-control" placeholder="Nom" required></div>
<div class="col-md-4"><input id="description" class="form-control" placeholder="Description"></div>
<div class="col-md-2"><input id="prix" type="number" step="0.01" class="form-control" placeholder="Prix" required></div>
<div class="col-md-2"><input id="categorie" class="form-control" placeholder="Catégorie"></div>
<div class="col-md-2"><button class="btn btn-primary w-100">Enregistrer</button></div>
</form>
<table class="table table-striped bg-white">
<thead class="table-dark"><tr><th>Nom</th><th>Description</th><th>Prix</th><th>Catégorie</th><th>Actions</th></tr></thead>
<tbody id="t"></tbody>
</table>
</div>
<script src="app.js"></script>
</body></html>
